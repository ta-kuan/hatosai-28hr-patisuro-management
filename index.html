<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="google" content="notranslate">
    <title>スロット - 28HR - 管理画面</title>
    <style>
      body {
        touch-action: manipulation;
        margin: 0;
        overflow: hidden;
      }
      .all {
        position: relative;
        margin: 0;
        padding: 0;
        width: 100vw;
        height: 100vh;
      }
      .titlem {
        position: absolute;
        left: 50%;
        top: 15%;
      }
      .titlem::after {
        content: "受け取ったおはじきの枚数を入力してボタンで送信";
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%,-50%);
        font-size: 250%;
        white-space: nowrap;
      }
      .titlesm {
        position: absolute;
        left: 50%;
        top: 18%;
      }
      .titlesm::after {
        content: "";
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%,-50%);
        font-size: 100%;
        white-space: nowrap;
      }
      .i1,
      .i2,
      .i3 {
        position: absolute;
      }
      .i1 {
        position: absolute;
      }
      .i2 {
        position: absolute;
      }
      .i3 {
        position: absolute;
      }
      .in1 {
        position: absolute;
      }
      .in2 {
        position: absolute;
      }
      .in3 {
        position: absolute;
      }
      .bt1 {
        position: absolute;
      }
      .bt2 {
        position: absolute;
      }
      .bt3 {
        position: absolute;
      }
    </style>
  </head>
  <body>
    <div class="all">
      <div class="titlem"></div>
      <div class="titlesm"></div>
      <div class="i1">
        <input id="text1" class="in1" type="number" value=1 min="1"　type="text" inputmode="numeric" pattern="[0-9]*" title="半角数字で入力してください">
        <button onclick="send(1,'text1')" class="bt1">送信1</button>
      </div>
      <div class="i2">
        <input id="text2" class="in2" type="number" value=1 min="1"　type="text" inputmode="numeric" pattern="[0-9]*" title="半角数字で入力してください">
        <button onclick="send(2,'text2')" class="bt2">送信2</button>
      </div>
      <div class="i3">
        <input id="text3" class="in3" type="number" value=1 min="1"　type="text" inputmode="numeric" pattern="[0-9]*" title="半角数字で入力してください">
        <button onclick="send(3,'text3')" class="bt3">送信3</button>
      </div>
    </div>
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
      import { getDatabase, ref, set } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";
      import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
      const firebaseConfig = {
        apiKey: "AIzaSyCdr0-2-H3jLSNsIIF1Bhou4BehZn8Ka2A",
        authDomain: "hatosai-link-28hr.firebaseapp.com",
        databaseURL: "https://hatosai-link-28hr-default-rtdb.firebaseio.com",
        projectId: "hatosai-link-28hr"
      };
      const app = initializeApp(firebaseConfig);
      const db = getDatabase(app);
      // Bだけログイン
      const auth = getAuth();
      signInAnonymously(auth);
      // 送信
      window.send = (id, inputId) => {
        const result = confirm("id" + id + "のコインを" + document.getElementById(inputId).value + "に変更");
        if (result) {
          const text = document.getElementById(inputId).value;
          set(ref(db, "messages/" + id), text);
        }
      };
    </script>
  </body>
</html>
