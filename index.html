<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="google" content="notranslate">
    <title>スロット - 28HR - 管理画面</title>
    <style>
      body {
        touch-action: manipulation;
        margin: 0;
        overflow: hidden;
      }
      .all {
        position: relative;
        margin: 0;
        padding: 0;
        width: 100vw;
        height: 100vh;
      }
      .titlem {
        position: absolute;
        left: 50%;
        top: 15%;
      }
      .titlem::after {
        content: "スロット - 28HR - 管理画面";
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%,-50%);
        font-size: 250%;
        white-space: nowrap;
      }
      .titlesm {
        position: absolute;
        left: 50%;
        top: 22%;
      }
      .titlesm::after {
        content: "受け取ったおはじきの枚数を入力してボタンで送信";
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%,-50%);
        font-size: 100%;
        white-space: nowrap;
      }
      .titlessm {
        position: absolute;
        left: 50%;
        top: 26%;
      }
      .titlessm::after {
        content: "払い出しはメダル枚数を確認しに行き、÷2(切り捨て)のおはじきを返却";
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%,-50%);
        font-size: 100%;
        white-space: nowrap;
      }
      .i1,
      .i2,
      .i3 {
        position: absolute;
        padding: 20px;
        top: 50%;
        width: 250px;
        height: 100px;
        background: rgb(255, 255, 200);
        border: solid 5px;
        border-radius: 5px;        
      }
      .i1 {
        left: 5%;
      }
      .i2 {
        left: 50%;
        transform: translateX(-50%);
      }
      .i3 {
        right: 5%;
      }
      .tx1,
      .tx2,
      .tx3 {
        position: absolute;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 150%;
        font-weight: bold;
        left: 50%;
        transform: translateX(-50%);
        top: -40%;
      }
      .in1,
      .in2,
      .in3 {
        position: absolute;
        padding: 0 10px;
        width: calc(100% - 60px);
        height: 25%;
        border: none;
        background: rgb(230, 230, 230);
        border-radius: 10px;
        font-size: 100%;
      }
      .bt1, 
      .bt2,
      .bt3 {
        position: absolute;
        padding: 0;
        width: 35%;
        height: 35%;
        left: 50%;
        bottom: 5%;
        border: none;
        border-radius: 10px;
        font-weight: bold;
        transform: translateX(-50%);
        font-size: 130%;
      }
      .stst1, 
      .stst2,
      .stst3 {
        position: absolute;
        padding: 0;
        width: 35%;
        height: 35%;
        left: 50%;
        bottom: -80%;
        border: none;
        border-radius: 10px;
        font-weight: bold;
        transform: translateX(-110%);
        font-size: 130%;
      }
      .ti1, 
      .ti2,
      .ti3 {
        position: absolute;
        padding: 0;
        width: 35%;
        height: 35%;
        left: 50%;
        bottom: -50%;
        border: none;
        border-radius: 10px;
        font-weight: bold;
        transform: translateX(-50%);
        font-size: 150%;
      }
      .ri1, 
      .ri2,
      .ri3 {
        position: absolute;
        padding: 0;
        width: 35%;
        height: 35%;
        left: 50%;
        bottom: -80%;
        border: none;
        border-radius: 10px;
        font-weight: bold;
        transform: translateX(10%);
        font-size: 130%;
      }
    </style>
  </head>
  <body>
    <div class="all">
      <div class="titlem"></div>
      <div class="titlesm"></div>
      <div class="titlessm"></div>
      <div class="i1">
        <div class="tx1">id1</div>
        <input id="text1" class="in1" type="number" value=1 min="1"　type="text" inputmode="numeric" pattern="[0-9]*" title="半角数字で入力してください">
        <button onclick="send(1,'text1')" class="bt1">送信1</button>
        <div class="ti1"></div>
        <button class="stst1">開始</button>
        <button class="ri1">リセット</button>
      </div>
      <div class="i2">
        <div class="tx2">id2</div>
        <input id="text2" class="in2" type="number" value=1 min="1"　type="text" inputmode="numeric" pattern="[0-9]*" title="半角数字で入力してください">
        <button onclick="send(2,'text2')" class="bt2">送信2</button>
        <div class="ti2"></div>
        <button class="stst2">開始</button>
        <button class="ri2">リセット</button>
      </div>
      <div class="i3">
        <div class="tx3">id3</div>
        <input id="text3" class="in3" type="number" value=1 min="1"　type="text" inputmode="numeric" pattern="[0-9]*" title="半角数字で入力してください">
        <button onclick="send(3,'text3')" class="bt3">送信3</button>
        <div class="ti3"></div>
        <button class="stst3">開始</button>
        <button class="ri3">リセット</button>
      </div>
    </div>
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
      import { getDatabase, ref, set } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";
      import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
      const firebaseConfig = {
        apiKey: "AIzaSyCdr0-2-H3jLSNsIIF1Bhou4BehZn8Ka2A",
        authDomain: "hatosai-link-28hr.firebaseapp.com",
        databaseURL: "https://hatosai-link-28hr-default-rtdb.firebaseio.com",
        projectId: "hatosai-link-28hr"
      };
      const app = initializeApp(firebaseConfig);
      const db = getDatabase(app);
      // Bだけログイン
      const auth = getAuth();
      signInAnonymously(auth);
      // 送信
      window.send = (id, inputId) => {
        const result = confirm(
          "id" + id + "のコインを" + document.getElementById(inputId).value + "に変更"
        );
        if (result) {
          const text = document.getElementById(inputId).value;
          set(ref(db, "messages/" + id), {
            value: text,
            time: Date.now()
          });
        }
      };
      const ti1 = document.querySelector(".ti1");
      const ti2 = document.querySelector(".ti2");
      const ti3 = document.querySelector(".ti3");
      const stst1 = document.querySelector(".stst1");
      const stst2 = document.querySelector(".stst2");
      const stst3 = document.querySelector(".stst3");
      const ri1 = document.querySelector(".ri1");
      const ri2 = document.querySelector(".ri2");
      const ri3 = document.querySelector(".ri3");
      const timer1 = { m: 0, s: 0, c: 0, running: false };
      const timer2 = { m: 0, s: 0, c: 0, running: false };
      const timer3 = { m: 0, s: 0, c: 0, running: false };
      stst1.textContent = "開始";
      stst2.textContent = "開始";
      stst3.textContent = "開始";
      const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));
      async function down(ti, stst, timer) {
        if (timer.running) return;
        timer.running = true;
        while (timer.c === 1) {
          await sleep(1000);
          if (timer.c === 0) break;
          if (timer.s !== 0) {
            timer.s--;
          } else {
            timer.s = 59;
            timer.m--;
          }
          ti.textContent =
            timer.m + ":" + String(timer.s).padStart(2, "0");
          if (timer.m === 0 && timer.s === 0) {
            timer.c = 0;
            stst.textContent = "開始";
            break;
          }
        }
        timer.running = false;
      }
      function start(ti, stst, timer) {
        timer.c = 1;
        if (timer.m === 0 && timer.s === 0) {
          timer.m = 5;
          timer.s = 0;
        }
        ti.textContent =
          timer.m + ":" + String(timer.s).padStart(2, "0");
        stst.textContent = "停止";
        down(ti, stst, timer);
      }
      function reset(ti, stst, timer) {
        timer.c = 0;
        timer.m = 0;
        timer.s = 0;
        ti.textContent = "0:00";
        stst.textContent = "開始";
      }
      stst1.addEventListener("click", () => {
        if (stst1.textContent === "開始") {
          start(ti1, stst1, timer1);
        } else {
          timer1.c = 0;
          stst1.textContent = "開始";
        }
      });
      stst2.addEventListener("click", () => {
        if (stst2.textContent === "開始") {
          start(ti2, stst2, timer2);
        } else {
          timer2.c = 0;
          stst2.textContent = "開始";
        }
      });
      stst3.addEventListener("click", () => {
        if (stst3.textContent === "開始") {
          start(ti3, stst3, timer3);
        } else {
          timer3.c = 0;
          stst3.textContent = "開始";
        }
      });
      ri1.addEventListener("click", () => {
        reset(ti1, stst1, timer1);
      });
      ri2.addEventListener("click", () => {
        reset(ti2, stst2, timer2);
      });
      ri3.addEventListener("click", () => {
        reset(ti3, stst3, timer3);
      });
    </script>
  </body>
</html>
